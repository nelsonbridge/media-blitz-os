name: One-Time Authorized Branch Cleanup

on:
  pull_request:
    branches: [sandbox]
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  cleanup:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.ref == 'maintenance/authorized-branch-cleanup'
    runs-on: ubuntu-latest
    steps:
      - name: Close stale pull requests, delete unapproved branches, and remove this workflow
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          repository = os.environ["GITHUB_REPOSITORY"]
          token = os.environ["GITHUB_TOKEN"]
          protected = {"main", "sandbox"}
          workflow_path = ".github/workflows/one-time-authorized-branch-cleanup.yml"

          def api(method, path, payload=None, allow=()):
              data = None if payload is None else json.dumps(payload).encode("utf-8")
              request = Request(
                  f"https://api.github.com{path}",
                  data=data,
                  method=method,
                  headers={
                      "Accept": "application/vnd.github+json",
                      "Authorization": f"Bearer {token}",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "authorized-branch-cleanup",
                      "Content-Type": "application/json",
                  },
              )
              try:
                  with urlopen(request, timeout=30) as response:
                      body = response.read()
                      return json.loads(body) if body else None
              except HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  if exc.code in allow:
                      return None
                  raise RuntimeError(f"GitHub API {exc.code} for {method} {path}: {body}") from exc

          closed_prs = []
          for pr in api("GET", f"/repos/{repository}/pulls?state=open&per_page=100"):
              head = pr.get("head") or {}
              if head.get("ref") not in protected:
                  api("PATCH", f"/repos/{repository}/pulls/{pr['number']}", {"state": "closed"})
                  closed_prs.append(pr["number"])

          branches = [
              item["name"]
              for item in api("GET", f"/repos/{repository}/branches?per_page=100")
          ]
          deleted = []
          for branch in branches:
              if branch in protected:
                  continue
              api(
                  "DELETE",
                  f"/repos/{repository}/git/refs/heads/{quote(branch, safe='')}",
                  allow=(404,),
              )
              deleted.append(branch)

          remaining = sorted(
              item["name"]
              for item in api("GET", f"/repos/{repository}/branches?per_page=100")
          )
          if remaining != ["main", "sandbox"]:
              raise RuntimeError(f"Branch cleanup failed; remaining branches: {remaining}")

          encoded_path = quote(workflow_path, safe="/")
          metadata = api(
              "GET",
              f"/repos/{repository}/contents/{encoded_path}?ref=sandbox",
          )
          api(
              "DELETE",
              f"/repos/{repository}/contents/{encoded_path}",
              {
                  "message": "Remove completed one-time branch cleanup workflow [skip ci]",
                  "sha": metadata["sha"],
                  "branch": "sandbox",
              },
          )

          print(json.dumps({
              "closed_pull_requests": sorted(closed_prs),
              "deleted_branches": sorted(deleted),
              "remaining_branches": remaining,
              "workflow_removed": workflow_path,
          }, indent=2))
          PY
