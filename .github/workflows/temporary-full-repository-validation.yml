name: Temporary Full Repository Validation

on:
  pull_request:
    branches: [sandbox]
    paths:
      - ".github/workflows/temporary-full-repository-validation.yml"
      - ".gitattributes"

permissions:
  contents: read

jobs:
  windows-full-suite:
    name: Windows full suite
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip; python -m pip install -e ".[test]"
      - name: Regenerate current integrity evidence in ephemeral checkout
        run: >-
          python scripts/generate_release_integrity_evidence.py
          --output-directory releases/enki-0.1.0-rc1/integrity
          --verifier-source-commit 8161b23b2e883278f25f3539ee3e392b8eb04033
      - name: Run complete suite with branch coverage
        run: python -m pytest

  terraform-offline:
    name: Terraform offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.9.0"
      - name: Check formatting
        working-directory: infrastructure/terraform
        run: terraform fmt -check -recursive
      - name: Initialize without backend
        working-directory: infrastructure/terraform
        run: terraform init -backend=false
      - name: Validate configuration
        working-directory: infrastructure/terraform
        run: terraform validate

  container-build:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Build immutable Enki image locally
        run: |
          docker build \
            --build-arg NKS_GIT_COMMIT="${GITHUB_SHA}" \
            --build-arg NKS_BUILD_TIMESTAMP="2026-08-03T00:00:00Z" \
            --build-arg NKS_RELEASE_ID="enki-0.1.0-rc1" \
            --tag project-enki:repository-validation \
            .

  bootstrap-static:
    name: Bootstrap shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate bootstrap shell syntax
        run: bash -n infrastructure/bootstrap/bootstrap-gcp.sh
