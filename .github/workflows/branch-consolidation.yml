name: Branch Consolidation Governance

on:
  workflow_dispatch:
  pull_request:
    branches: [sandbox]
    types: [closed]

permissions:
  contents: write

concurrency:
  group: branch-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Check out complete repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: sandbox
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify cleanup governance
        run: |
          python - <<'PY'
          from scripts.cleanup_branches import archive_tag, merged_target, validate_final_branches

          assert archive_tag("execution/complete-enki-sprint-14", "abcdef1234567890") == (
              "archive/branches/execution-complete-enki-sprint-14-abcdef123456"
          )
          assert merged_target({"main": "diverged", "sandbox": "ahead"}) == "sandbox"
          assert merged_target({"main": "identical", "sandbox": "behind"}) == "main"
          validate_final_branches(["sandbox", "main"])
          print("Branch cleanup governance verified")
          PY

      - name: Produce branch cleanup dry-run report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cleanup_branches.py \
            --repository "$GITHUB_REPOSITORY" \
            --report generated/audit/branch-cleanup.json

      - name: Assert dry-run mode
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("generated/audit/branch-cleanup.json").read_text(encoding="utf-8"))
          assert report["apply"] is False, report
          print("Verified dry-run branch cleanup governance report")
          PY

      - name: Commit cleanup report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add generated/audit/branch-cleanup.json
          if ! git diff --cached --quiet; then
            git commit -m "Record two-branch repository consolidation [skip ci]"
            git push origin HEAD:sandbox
          fi
