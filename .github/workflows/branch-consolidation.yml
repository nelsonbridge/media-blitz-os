name: Branch Consolidation

on:
  workflow_dispatch:
  pull_request:
    branches: [sandbox]
    types: [closed]

permissions: {}

concurrency:
  group: branch-consolidation
  cancel-in-progress: false

jobs:
  govern:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out authoritative sandbox
        uses: actions/checkout@v4
        with:
          ref: sandbox
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install branch-governance test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Run branch-cleanup guardrail tests
        run: python -m pytest tests/test_branch_cleanup.py --no-cov

      - name: Produce governed branch report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          MERGED_HEAD_BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            python scripts/cleanup_branches.py \
              --repository "$GITHUB_REPOSITORY" \
              --report generated/audit/branch-cleanup.json
          else
            python scripts/cleanup_branches.py \
              --repository "$GITHUB_REPOSITORY" \
              --branch "$MERGED_HEAD_BRANCH" \
              --apply \
              --report generated/audit/branch-cleanup.json
          fi

      - name: Verify and publish governed result
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          path = Path("generated/audit/branch-cleanup.json")
          report = json.loads(path.read_text())
          assert report["protected_unchanged"] is True, report
          if os.environ["EVENT_NAME"] == "workflow_dispatch":
              assert report["apply"] is False, report
              assert report["deleted"] == [], report
          else:
              assert report["after"] == ["main", "sandbox"], report
          print("Verified governed branch result")
          with Path(os.environ["GITHUB_STEP_SUMMARY"]).open("a", encoding="utf-8") as summary:
              summary.write("## Branch governance evidence\n\n```json\n")
              summary.write(json.dumps(report, indent=2, sort_keys=True))
              summary.write("\n```\n")
          PY
