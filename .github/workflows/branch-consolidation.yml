name: Branch Consolidation Audit

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: branch-consolidation-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: sandbox
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run branch-cleanup guardrail tests
        run: python -m pytest tests/test_branch_cleanup.py --no-cov

      - name: Produce non-destructive branch audit
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/cleanup_branches.py \
            --repository "$GITHUB_REPOSITORY" \
            --report generated/audit/branch-cleanup.json

      - name: Upload branch audit
        uses: actions/upload-artifact@v4
        with:
          name: branch-consolidation-audit
          path: generated/audit/branch-cleanup.json
          if-no-files-found: error
