name: One-time Project Enki Identity Reconciliation

on:
  push:
    branches:
      - agent/project-enki-identity-completion

permissions:
  contents: write

concurrency:
  group: project-enki-identity-reconciliation
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out reconciliation branch
        uses: actions/checkout@v4
        with:
          ref: agent/project-enki-identity-completion
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Replace legacy parent-system identity
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              "architecture/adr/ADR-0001-own-the-contract-layer.md",
              "architecture/connected-ecosystem-inventory.md",
              "architecture/internal-coherence-engine.md",
              "architecture/knowledge-graph-model.md",
              "architecture/opportunity-engine.md",
              "architecture/runtime-topology.md",
              "architecture/transport-language-layer.md",
              "briefings/NKS-BRF-000001-knowledge-manufacturing-operating-model.md",
              "context/NKS-CTX-000001-operating-model-ai-context-pack.md",
              "contracts/adapter-contract-v1.md",
              "contracts/payloads/NKS-PUB-000001-publication-contract.yaml",
              "contracts/publication-contract-v1.md",
              "engineering/technical-backlog.md",
              "governance/capability-reassessment-protocol.md",
              "governance/diagram-language-standard.md",
              "governance/portable-runtime-rule.md",
              "governance/publication-readiness-gate.md",
              "governance/source-proof-publication-rule.md",
              "governance/visual-knowledge-system.md",
              "integrations/direct-publication-adapter-decision.md",
              "metrics/corpus-health-model.md",
              "metrics/corpus-health-register.md",
              "metrics/graph-coverage-matrix.md",
              "metrics/manufacturing-metrics-framework.md",
              "ops/adaptive-prioritization-engine.md",
              "ops/autonomous-prioritization-policy.md",
              "ops/continuous-ingestion-workflow.md",
              "roadmap/capability-gap-register.md",
              "roadmap/knowledge-roadmap.md",
              "roadmap/platform-capability-roadmap.md",
              "schemas/visual-artifact-schema.md",
              "security/integration-security-boundary-v1.md",
              "validation/continuous-validation-framework.md",
              "visuals/diagrams/NKS-DGM-000001.md",
              "visuals/hero/NKS-HRO-000001.md",
              "visuals/packages/NKS-VIS-000001.md",
              "visuals/quote-cards/NKS-QTC-000001.md",
          ]

          missing = []
          unchanged = []
          for raw in paths:
              path = Path(raw)
              if not path.exists():
                  missing.append(raw)
                  continue
              text = path.read_text(encoding="utf-8")
              updated = text.replace("Nelson Knowledge System", "Project Enki")
              if updated == text:
                  unchanged.append(raw)
                  continue
              path.write_text(updated, encoding="utf-8")

          if missing:
              raise SystemExit(f"Missing expected files: {missing}")
          print(f"Updated {len(paths) - len(unchanged)} files")
          if unchanged:
              print("Already reconciled:", unchanged)
          PY

      - name: Commit reconciliation and retire workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/project-enki-identity-reconciliation.yml
          git add \
            architecture \
            briefings/NKS-BRF-000001-knowledge-manufacturing-operating-model.md \
            context/NKS-CTX-000001-operating-model-ai-context-pack.md \
            contracts \
            engineering/technical-backlog.md \
            governance \
            integrations/direct-publication-adapter-decision.md \
            metrics \
            ops \
            roadmap \
            schemas/visual-artifact-schema.md \
            security/integration-security-boundary-v1.md \
            validation/continuous-validation-framework.md \
            visuals
          git diff --cached --check
          git commit -m "Normalize current authority to Project Enki"
          git push origin HEAD:agent/project-enki-identity-completion
